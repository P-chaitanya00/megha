[build]
  publish = "."
  functions = "netlify/functions"

[[redirects]]
  from = "/.netlify/scripts/hud*"
  to = "/assets/empty.js"
  status = 200
  force = true

[[redirects]]
  from = "/api/sync-products"
  to = "/.netlify/functions/sync-products"
  status = 200

[[redirects]]
  from = "/api/send-order"
  to = "/.netlify/functions/send-order"
  status = 200

[[redirects]]
  from = "/api/sync-store"
  to = "/.netlify/functions/sync-products"
  status = 200
